spring.application.name=backend
spring.docker.compose.enabled=false

# PostgreSQL example (for local/dev deployment)
# spring.datasource.url=jdbc:postgresql://localhost:5432/flightdb
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Load environment variables from .env (optional). Put DB_* entries in .env at project root.
spring.config.import=optional:file:.env[.properties]

# datasource taken from .env via placeholders
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
