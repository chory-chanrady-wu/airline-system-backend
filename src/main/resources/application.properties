spring.application.name=backend
spring.docker.compose.enabled=false

# PostgreSQL example (for local/dev deployment)
# spring.datasource.url=jdbc:postgresql://localhost:5432/flightdb
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Local fallback for development/testing without a live PostgreSQL instance
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flightdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.sql.init.mode=never
